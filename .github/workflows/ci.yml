name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Check backend files exist
        working-directory: server
        run: |
          test -f index.js && echo "index.js OK"
          test -f db.js && echo "db.js OK"
          test -f routes/auth.js && echo "auth.js OK"
          test -f routes/items.js && echo "items.js OK"
          test -f middleware/verifyToken.js && echo "verifyToken.js OK"

  frontend-check:
    name: Frontend build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: client
        run: npm install --legacy-peer-deps

      - name: Fix vite permissions
        run: chmod +x client/node_modules/.bin/vite || true

      - name: Build frontend
        working-directory: client
        run: node node_modules/vite/bin/vite.js build
        env:
          VITE_API_URL: http://localhost:5000/api

      - name: Confirm build output exists
        working-directory: client
        run: ls dist/
